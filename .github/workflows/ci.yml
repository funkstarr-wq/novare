name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  # Throwaway value for CI's disposable databases; real secrets only ever live in Railway.
  PAYLOAD_SECRET: ci-only-payload-secret

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check generated types, import map and migrations are committed
        run: |
          pnpm generate:types
          pnpm generate:importmap
          pnpm payload migrate:create schema-drift --skip-empty
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale. Run 'pnpm generate' and 'pnpm payload migrate:create <name>', then commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      - run: pnpm typecheck

  test:
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/novare_test
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm payload migrate
      - run: pnpm test

  build-no-db:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build without a database (Railway builds have no private network)
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL must be unset for this job"
            exit 1
          fi
          pnpm build

      # e2e, a11y and lighthouse run this exact build, proving it works once a database exists.
      # Tarred because .next/node_modules holds symlinks into pnpm's store, which upload-artifact
      # would replace with copies that can no longer resolve their own dependencies.
      - name: Pack build
        run: tar --exclude=.next/cache -cf next-build.tar .next

      - uses: actions/upload-artifact@v6
        with:
          name: next-build
          path: next-build.tar
          retention-days: 3

  e2e:
    needs: build-no-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/novare_test
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: next-build

      - name: Unpack build
        run: tar -xf next-build.tar

      - name: Apply migrations
        run: pnpm payload migrate

      - name: Generate a throwaway admin for this run
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SEED_ADMIN_EMAIL=ci-admin@example.test" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Seed
        run: pnpm seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: build-no-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/novare_test
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: next-build

      - name: Unpack build
        run: tar -xf next-build.tar

      - name: Apply migrations and seed
        run: |
          pnpm payload migrate
          pnpm seed

      - name: Lighthouse CI (budgets in lighthouserc.json)
        run: pnpm lhci

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: lhci-reports/
          include-hidden-files: true
          retention-days: 7

  a11y:
    needs: build-no-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/novare_test
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: next-build

      - name: Unpack build
        run: tar -xf next-build.tar

      - name: Apply migrations and seed
        run: |
          pnpm payload migrate
          pnpm seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:a11y

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7
